spring:
  datasource:
    url: jdbc:h2:mem:zhixiaojiang;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 16379
  sql:
    init:
      mode: always
      schema-locations: classpath:demo-schema.sql
      data-locations: classpath:demo-data.sql
server:
  port: 8082
app:
  redis-enabled: false
