server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://117.72.13.19:3306/zhixiaojiang?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:zhixiaojiang}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
  data:
    redis:
      host: ${REDIS_HOST:117.72.13.19}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  sql:
    init:
      encoding: UTF-8
      mode: ${DB_INIT_MODE:never}
      schema-locations: classpath:schema.sql,classpath:student-portal-schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
mybatis:
  # 映射文件放在 resources/mapper 下（与 Mapper 接口不同包），因此显式声明扫描位置
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
    default-statement-timeout: 30

app:
  jwt-secret: ${JWT_SECRET:change-me-in-local-env-please-32-chars}
  cookie-secure: ${COOKIE_SECURE:false}
  redis-prefix: 'zhixiaojiang:'
  redis-enabled: ${REDIS_ENABLED:true}
