name: Deploy

# 上线流水线：构建 → 推送镜像到国内仓库 → 服务器拉取镜像并重启容器。
#
# 为什么是「推送镜像 + 服务器拉取」而不是直接传文件：
#   实测 GitHub 运行器到服务器的跨境上行只有 ~0.83 MB/s 且反复停顿，56 MB 发布包要一小时；
#   而国内仓库被服务器拉取是内网级速度。因此构建产物先变成镜像放进仓库，部署只传几 KB 的编排文件。
#
# 默认手动触发；确认稳定后取消 push 触发器注释即可改为「合入 main 自动上线」。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '确认执行上线：请输入 deploy'
        required: true
      image_tag:
        description: '回滚用：填上一次成功部署的 commit SHA（留空则构建并部署当前提交）'
        required: false
        default: ''
#  push:
#    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    # 回滚路径不需要重新构建
    if: inputs.image_tag == ''
    uses: ./.github/workflows/build.yml

  images:
    name: 构建并推送镜像
    needs: [build]
    if: always() && inputs.image_tag == '' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
    steps:
      - name: 校验仓库配置
        run: |
          set -euo pipefail
          test -n "$REGISTRY" || { echo "缺少仓库变量 REGISTRY（例如 registry.cn-hangzhou.aliyuncs.com）"; exit 1; }
          test -n "$REGISTRY_NAMESPACE" || { echo "缺少仓库变量 REGISTRY_NAMESPACE（命名空间）"; exit 1; }

      - uses: actions/checkout@v4

      - name: 下载后端 jar
        uses: actions/download-artifact@v4
        with:
          name: zhixiaojiang-server-jar
          path: build/server

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: zhixiaojiang-web-dist
          path: build/web/dist

      - name: 组装镜像上下文
        run: |
          set -euo pipefail
          mv build/server/zhixiaojiang-server-*.jar build/server/app.jar
          cp deploy/Dockerfile.server build/server/Dockerfile
          cp deploy/Dockerfile.web build/web/Dockerfile
          cp deploy/nginx.conf build/web/nginx.conf
          ls -la build/server build/web

      - name: 登录镜像仓库
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USERNAME" && test -n "$REGISTRY_PASSWORD" || { echo "缺少 REGISTRY_USERNAME / REGISTRY_PASSWORD"; exit 1; }
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      - name: 构建并推送两个镜像
        run: |
          set -euo pipefail
          app="$REGISTRY/$REGISTRY_NAMESPACE/zhixiaojiang-app"
          web="$REGISTRY/$REGISTRY_NAMESPACE/zhixiaojiang-web"
          for tag in "${{ github.sha }}" latest; do
            docker build -t "$app:$tag" build/server
            docker build -t "$web:$tag" build/web
            docker push "$app:$tag"
            docker push "$web:$tag"
          done
          {
            echo "### 镜像已推送"
            echo ""
            echo "- \`$app:${{ github.sha }}\`"
            echo "- \`$web:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 服务器拉取并重启
    needs: [build, images]
    if: always() && (inputs.image_tag != '' || needs.images.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: 校验确认输入
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "未输入 deploy，已取消。"; exit 1
          fi

      - uses: actions/checkout@v4

      # 只上传编排文件与一份记录镜像地址的 .env（几 KB），不再传构建产物
      - name: 生成部署参数文件
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then
            app="${{ vars.REGISTRY }}/${{ vars.REGISTRY_NAMESPACE }}/zhixiaojiang-app:${{ github.sha }}"
            web="${{ vars.REGISTRY }}/${{ vars.REGISTRY_NAMESPACE }}/zhixiaojiang-web:${{ github.sha }}"
          else
            app="${{ vars.REGISTRY }}/${{ vars.REGISTRY_NAMESPACE }}/zhixiaojiang-app:$tag"
            web="${{ vars.REGISTRY }}/${{ vars.REGISTRY_NAMESPACE }}/zhixiaojiang-web:$tag"
          fi
          mkdir -p release
          cp deploy/docker-compose.yml release/docker-compose.yml
          {
            echo "IMAGE_TAG=$tag"
            echo "APP_IMAGE=$app"
            echo "WEB_IMAGE=$web"
          } > release/.env
          cat release/.env

      - name: 配置 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo "缺少 DEPLOY_SSH_KEY 仓库密钥"; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "缺少 DEPLOY_HOST 仓库变量"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -o ConnectTimeout=10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 上传编排文件（仅几 KB）
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          COPYFILE_DISABLE=1 tar -C release -czf - . | ssh -o ConnectTimeout=10 "$target" 'tar -xzf - -C /opt/zhixiaojiang'

      - name: 拉取镜像并重启容器
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/zhixiaojiang && docker compose pull && docker compose up -d && docker compose ps'

      - name: 健康检查（在服务器内网探测）
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if ssh -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'curl -fsS -m 5 http://127.0.0.1/api/v1/auth/csrf >/dev/null'; then
              echo "第 $attempt 次探测：应用已就绪 ✅"; exit 0
            fi
            echo "第 $attempt 次探测未就绪，等待 5 秒…"; sleep 5
          done
          echo "健康检查失败，最近日志："; ssh -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/zhixiaojiang && docker compose logs --tail=50 app'
          exit 1

      - name: 输出部署摘要
        if: success()
        run: |
          {
            echo "### 部署完成"
            echo ""
            echo "- 镜像标签：\`${{ inputs.image_tag || github.sha }}\`"
            echo "- 访问入口：\`http://${{ vars.DEPLOY_HOST }}/\`"
            echo "- 回滚：重新触发本流水线，image_tag 填上一个成功的 SHA"
          } >> "$GITHUB_STEP_SUMMARY"
