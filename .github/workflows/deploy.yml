name: Deploy

# 上线流水线：云端构建 → 本机自托管运行器上传发布包 → 服务器本地构建镜像并重启容器。
#
# 运行器分工（实测网络决定）：
#   build  : GitHub 云端运行器（后端测试 + 前端构建，产出制品）
#   deploy : 本机自托管运行器（macOS）——GitHub→本机 6.2 MB/s、本机→服务器 1.6 MB/s；
#            而云端运行器直传服务器只有 0.83 MB/s 且反复停顿，56 MB 要一小时。
#
# 安全约定：部署私钥只写入运行器的临时目录，不使用也不修改用户的 ~/.ssh。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '确认执行上线：请输入 deploy'
        required: true
      image_tag:
        description: '回滚用：填上一次成功部署的 commit SHA（留空则构建并部署当前提交）'
        required: false
        default: ''
#  push:
#    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    # 回滚路径不需要重新构建
    if: inputs.image_tag == ''
    uses: ./.github/workflows/build.yml

  deploy:
    name: 上传发布包并在服务器重启
    needs: [build]
    if: always() && (inputs.image_tag != '' || needs.build.result == 'success')
    runs-on: [self-hosted, macOS]
    steps:
      - name: 校验确认输入
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "未输入 deploy，已取消。"; exit 1
          fi

      - uses: actions/checkout@v4

      - name: 下载后端 jar
        if: inputs.image_tag == ''
        uses: actions/download-artifact@v4
        with:
          name: zhixiaojiang-server-jar
          path: build/server

      - name: 下载前端产物
        if: inputs.image_tag == ''
        uses: actions/download-artifact@v4
        with:
          name: zhixiaojiang-web-dist
          path: build/web/dist

      # 发布包结构镜像服务器上的 /opt/zhixiaojiang；app.env 始终留在服务器，不参与上传
      - name: 组装发布包
        if: inputs.image_tag == ''
        run: |
          set -euo pipefail
          mv build/server/zhixiaojiang-server-*.jar build/server/app.jar
          cp deploy/Dockerfile.server build/server/Dockerfile
          cp deploy/Dockerfile.web build/web/Dockerfile
          cp deploy/nginx.conf build/web/nginx.conf
          cp deploy/docker-compose.yml docker-compose.yml
          cp deploy/app.env.example app.env.example
          tag="${{ inputs.image_tag }}"
          [ -n "$tag" ] || tag="${{ github.sha }}"
          printf 'IMAGE_TAG=%s\n' "$tag" > .env
          echo "本次部署镜像标签: $tag"
          find . -maxdepth 3 -name 'Dockerfile' -o -maxdepth 3 -name 'app.jar' | sort

      - name: 准备 SSH 凭据（写入运行器临时目录）
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo "缺少 DEPLOY_SSH_KEY 仓库密钥"; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "缺少 DEPLOY_HOST 仓库变量"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -o ConnectTimeout=10 -H "$DEPLOY_HOST" > "$RUNNER_TEMP/known_hosts" 2>/dev/null || true
          {
            echo "SSH_KEY_PATH=$key"
            echo "SSH_KNOWN_HOSTS=$RUNNER_TEMP/known_hosts"
            echo "SSH_OPTS=-i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
          } >> "$GITHUB_ENV"

      - name: 上传发布包到服务器
        if: inputs.image_tag == ''
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh $SSH_OPTS "$target" 'rm -rf /opt/zhixiaojiang/build'
          # macOS 的 tar 会额外写入 ._ 资源叉文件，这里关闭
          COPYFILE_DISABLE=1 tar -czf - build docker-compose.yml app.env.example .env | ssh $SSH_OPTS "$target" 'tar -xzf - -C /opt/zhixiaojiang'
          ssh $SSH_OPTS "$target" 'ls -la /opt/zhixiaojiang && du -sh /opt/zhixiaojiang/build'

      - name: 构建镜像并重启容器
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then
            tag="${{ github.sha }}"
            ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/zhixiaojiang && IMAGE_TAG=$tag docker compose up -d --build"
          else
            # 回滚：使用服务器上已存在的旧镜像，不重新构建
            echo "回滚到镜像标签 $tag"
            ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/zhixiaojiang && IMAGE_TAG=$tag docker compose up -d"
          fi
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/zhixiaojiang && docker compose ps'

      - name: 健康检查（在服务器内网探测）
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'curl -fsS -m 5 http://127.0.0.1/api/v1/auth/csrf >/dev/null'; then
              echo "第 $attempt 次探测：应用已就绪 ✅"; exit 0
            fi
            echo "第 $attempt 次探测未就绪，等待 5 秒…"; sleep 5
          done
          echo "健康检查失败，最近日志："; ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/zhixiaojiang && docker compose logs --tail=50 app'
          exit 1

      - name: 输出部署摘要
        if: success()
        run: |
          {
            echo "### 部署完成"
            echo ""
            echo "- 镜像标签：\`${{ inputs.image_tag || github.sha }}\`"
            echo "- 访问入口：\`http://${{ vars.DEPLOY_HOST }}/\`"
            echo "- 回滚：重新触发本流水线，image_tag 填上一个成功的 SHA"
          } >> "$GITHUB_STEP_SUMMARY"
